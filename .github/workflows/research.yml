name: research

on:
  push:
    branches: ["master", "main", "ccr-**"]
    paths: ["research/**", "MGC.csv", ".github/workflows/research.yml"]
  pull_request:
    paths: ["research/**", "MGC.csv", ".github/workflows/research.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Quick experiment (smoke)
        run: python experiment.py --quick --out results_quick
      - uses: actions/upload-artifact@v4
        with:
          name: results-quick
          path: research/results_quick/
